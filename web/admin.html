<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Apollo PC+2 Test Console</title><style>
:root{color-scheme:dark;--bg:#07121b;--p:#0d2231;--p2:#102b3d;--line:#294a60;--txt:#eef6fb;--mut:#9db1bf;--g:#72e79c;--a:#ffd166;--r:#ff7979;--b:#55b4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.25 system-ui,sans-serif;overflow:hidden}button,input{font:inherit}button{border:1px solid var(--line);background:#17364c;color:var(--txt);border-radius:6px;padding:7px;cursor:pointer}.good{background:#155c35}.warn{background:#594814}.bad{background:#642b2b}.primary{background:#1268b5}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line);background:#081722}.get{font-size:27px;font-weight:850;color:#a8f7be}.phase{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-weight:800}.RUNNING{color:var(--g)}.PAUSED{color:var(--a)}.main{min-height:0;padding:7px;display:grid;grid-template-rows:auto auto 1fr;gap:7px}.bar,.card{background:var(--p);border:1px solid var(--line);border-radius:8px}.bar{padding:7px}.next{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.next strong{color:var(--b);font-size:15px}.count{color:var(--a);font-weight:800}.stations{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.st{min-width:0;padding:7px 3px;text-align:center;border:1px solid var(--line);border-radius:6px;background:#0a1c28;font-size:10px}.st.sel{outline:2px solid var(--b)}.st.ready{color:var(--g);border-color:#286644}.st.no{color:var(--r);border-color:#7b3d3d}.st .s2{display:block;color:var(--mut);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work{min-height:0;display:grid;grid-template-columns:1fr .9fr;gap:7px}.card{padding:8px;min-height:0;overflow:auto}.card h2{font-size:11px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.stationHead{display:flex;justify-content:space-between;align-items:center;gap:6px}.stationHead strong{font-size:17px}.status{font-size:11px;color:var(--mut)}.actionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:7px}.wide{grid-column:1/-1}.info{margin-top:7px;display:grid;gap:3px;font:11px/1.25 ui-monospace,monospace}.datum{display:grid;grid-template-columns:minmax(95px,.8fr) 1.2fr;gap:6px;padding:4px;border-bottom:1px dotted #244254}.datum .k{color:var(--mut)}.alerts{display:grid;gap:5px}.alert{padding:7px;border:1px solid var(--line);border-radius:6px;background:#091b27}.alert.attn{border-color:#7a6421;background:#30270d}.alert.bad{border-color:#824242;background:#311515}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.bottom{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#081722;padding:4px}.bottom button{border:0;background:transparent;color:var(--mut);padding:7px 2px}.bottom button.active{color:var(--b);font-weight:800}.drawer{position:fixed;inset:46px 6px 43px;z-index:8;background:#091824;border:1px solid var(--line);border-radius:9px;padding:8px;display:none;overflow:auto}.drawer.open{display:block}.drawer h2{font-size:12px;color:var(--mut);text-transform:uppercase}.timeline,.log{font:11px/1.3 ui-monospace,monospace}.ev,.li{padding:5px;border-bottom:1px solid #1d3b4e}.missed{color:#ffd3d3;background:#4a2222}.done{opacity:.55}.token{width:100%;background:#07131c;border:1px solid var(--line);color:var(--txt);padding:7px;border-radius:6px}.debugGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.err{position:fixed;left:8px;right:8px;bottom:46px;background:#652626;border:1px solid #a75b5b;padding:7px;border-radius:7px;z-index:10;display:none}
@media(max-width:800px){.top{padding:6px}.get{font-size:23px}.phase{font-size:10px}.main{padding:5px}.stations{grid-template-columns:repeat(4,1fr)}.work{grid-template-columns:1fr;grid-template-rows:1fr auto}.card{overflow:auto}.card.secondary{max-height:30vh}.datum{grid-template-columns:90px 1fr}.next{grid-template-columns:auto 1fr}.count{grid-column:2}.quick{grid-template-columns:repeat(3,1fr)}.debugGrid{grid-template-columns:1fr}.drawer{inset:43px 5px 43px}}
</style></head><body><div class="app">
<header class="top"><div id="get" class="get">--:--:--</div><div id="phase" class="phase">No session</div><div id="state" class="badge">NO SESSION</div></header>
<main class="main">
<section class="bar"><div id="next" class="next"><strong>Next --</strong><span>Waiting for session</span><span class="count"></span></div></section>
<section id="stations" class="stations"></section>
<section class="work"><section class="card"><div class="stationHead"><div><h2>Selected controller</h2><strong id="stationName">FLIGHT</strong></div><div id="stationStatus" class="status">unassigned</div></div><div id="actions" class="actionGrid"></div><div id="stationInfo" class="info"></div></section><section class="card secondary"><h2>Needs attention</h2><div id="alerts" class="alerts"></div></section></section>
</main>
<nav class="bottom"><button class="active" onclick="closeDrawer()">CONTROL</button><button onclick="openDrawer('time')">TIME</button><button onclick="openDrawer('log')">LOG</button><button onclick="openDrawer('debug')">DEBUG</button></nav>
<section id="drawer" class="drawer"></section><div id="err" class="err"></div></div>
<script>
const ST=['FLIGHT','CAPCOM','GUIDO','FIDO_RETRO','TELMU','INCO','CONTROL'];
const E=[['77:55:00','scenario_start_weak_link','Start'],['77:55:24','final_p30_lm_pad_readup_begins','Final PAD readup'],['77:59:17','communications_loud_and_clear_after_sband_change','Comms improve'],['78:00:00','final_pc2_solution_ready','Final solution'],['78:12:00','lm_burn_configuration_powerup','LM burn power-up'],['78:17:00','final_load_requested','Final load requested'],['78:17:00','final_load_transmission_started','Load transmission'],['78:21:54','ranging_switch_verification_requested','Ranging verify'],['78:23:05','computer_returned_to_crew','Computer to crew'],['79:17:00','final_go_no_go_poll','Final GO/NO-GO'],['79:23:00','p40_active_final_preburn','P40 preburn'],['79:27:28.30','manual_two_jet_ullage_begins','Ullage'],['79:27:38.30','dps_ignition','IGNITION'],['79:27:43.30','throttle_command_40_percent','40% command'],['79:27:51','crew_reports_40_percent','Crew 40%'],['79:28:04.30','throttle_command_maximum','Max command'],['79:28:09','crew_reports_100_percent','Crew 100%'],['79:32:02.12','guided_cutoff','CUTOFF'],['79:32:41','postburn_residual_review','Residual review'],['79:34:00','lm_powerdown_transition','Powerdown'],['79:52:00','ptc_preparation_begins','PTC preparation']];
let S=null,A=[],snaps={},selected='FLIGHT',drawerMode=null;const pid=s=>'test-'+s.toLowerCase().replace('_','-');
function sec(x){let p=x.split(':').map(Number);return p[0]*3600+p[1]*60+p[2]}function hms(s){if(s==null)return'--:--:--';s=Math.max(0,s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${q<10?'0':''}${q.toFixed(q%1?1:0)}`}
function hdr(){let t=sessionStorage.getItem('apollo_facilitator_token')||'';return{'Content-Type':'application/json','X-Apollo-Facilitator':t}}async function req(url,opt={}){let r=await fetch(url,{...opt,headers:{...hdr(),...(opt.headers||{})}});if(!r.ok)throw Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.json()}async function post(url,body={}){try{await req(url,{method:'POST',body:JSON.stringify(body)});await refresh()}catch(e){show(e)}}function show(e){let x=document.getElementById('err');x.textContent=e.message||e;x.style.display='block';setTimeout(()=>x.style.display='none',5000)}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function applied(n){return A.some(x=>x.kind==='scenario_event_applied'&&x.details.event===n)}function missed(n){return A.some(x=>x.kind==='scenario_event_missed'&&x.details.event===n)}function owner(st){let ev=[...A].reverse().find(x=>(x.kind==='station_assigned'&&x.details.station===st)||(x.kind==='station_set_assigned'&&(x.details.stations||[]).includes(st)));return ev?.details.player_id||null}function readiness(st){let ev=[...A].reverse().find(x=>x.kind==='controller_readiness_report'&&x.actor===st);return ev?.details.ready===true?true:ev?false:null}function pending(){let q=new Map();for(const x of A){if(x.kind==='capcom_item_queued')q.set(x.details.item_id,x);if(x.kind==='capcom_item_transmitted')q.delete(x.details.item_id)}return[...q.values()]}
async function assign(st){if(owner(st))return;try{await req('/api/session/join',{method:'POST',body:JSON.stringify({player_id:pid(st),station:st})});await refresh()}catch(e){show(e)}}async function ready(st,v){let p=owner(st)||pid(st);if(!owner(st))await assign(st);await post(`/api/session/player/${p}/readiness`,{ready:v,note:'test console',station:st})}async function flight(go){await post(`/api/session/flight/${owner('FLIGHT')||pid('FLIGHT')}/decision`,{go,basis:'test console validation'})}async function queue(){await post(`/api/session/flight/${owner('FLIGHT')||pid('FLIGHT')}/capcom`,{action:'continue_pc2_burn_sequence',parameters:{},basis:'FLIGHT approved'})}async function transmit(id){await post(`/api/session/capcom/${owner('CAPCOM')||pid('CAPCOM')}/transmit/${id}`)}async function dp(){await post(`/api/session/control/${owner('CONTROL')||pid('CONTROL')}/delta-p-callout`,{basis:'ground ΔP criterion exceeded'})}async function evidence(){try{let x=await req(`/api/session/control/${owner('CONTROL')||pid('CONTROL')}/shutdown-evidence`);show(JSON.stringify(x))}catch(e){show(e)}}
function choose(st){selected=st;render()}function presentation(st){let x=snaps[st];if(!x)return null;return x.presentation||(x.presentations?x.presentations[st]:null)}function flatten(p){if(!p)return[];let out=[];if(p.fields)out.push(...p.fields);for(const s of p.sections||[])out.push(...(s.fields||[]));return out}function usefulFields(st){let f=flatten(presentation(st));return f.filter(x=>x.value!==null&&x.value!==undefined).slice(0,7)}
function renderTop(){document.getElementById('get').textContent=S?hms(S.get_s):'--:--:--';document.getElementById('phase').textContent=S?.phase||'No session';let b=document.getElementById('state');b.textContent=S?.status||'NO SESSION';b.className='badge '+(S?.status||'');let g=S?.get_s||0,n=E.find(e=>sec(e[0])>g&&!applied(e[1])&&!missed(e[1]));document.getElementById('next').innerHTML=n?`<strong>${n[0]}</strong><span>${n[2]}</span><span class="count">T−${hms(sec(n[0])-g)}</span>`:'<strong>Complete</strong><span>No remaining scheduled event</span><span></span>'}
function renderStations(){document.getElementById('stations').innerHTML=ST.map(st=>{let r=readiness(st),o=owner(st);return`<button class="st ${selected===st?'sel':''} ${r===true?'ready':r===false?'no':''}" onclick="choose('${st}')"><b>${st.replace('_','/')}</b><span class="s2">${r===true?'READY':r===false?'NOT READY':o?'NO REPORT':'UNASSIGNED'}</span></button>`}).join('')}
function renderController(){let st=selected,o=owner(st),r=readiness(st);document.getElementById('stationName').textContent=st.replace('_','/');document.getElementById('stationStatus').textContent=`${o||'unassigned'} · ${r===true?'READY':r===false?'NOT READY':'no report'}`;let a=[];if(!o)a.push(`<button class="wide" onclick="assign('${st}')">ASSIGN TEST CONTROLLER</button>`);a.push(`<button class="good" onclick="ready('${st}',true)">READY</button><button class="bad" onclick="ready('${st}',false)">NOT READY</button>`);if(st==='FLIGHT')a.push(`<button class="good" onclick="flight(true)">GO</button><button class="bad" onclick="flight(false)">NO-GO</button><button class="wide" onclick="queue()">QUEUE CAPCOM: CONTINUE BURN</button>`);if(st==='CAPCOM')for(const q of pending())a.push(`<button class="wide primary" onclick="transmit(${q.details.item_id})">TRANSMIT #${q.details.item_id}: ${esc(q.details.action)}</button>`);if(st==='CONTROL')a.push(`<button class="bad" onclick="dp()">ΔP CALLOUT</button><button onclick="evidence()">CHECK SHUTDOWN EVIDENCE</button>`);document.getElementById('actions').innerHTML=a.join('');let f=usefulFields(st);document.getElementById('stationInfo').innerHTML=f.length?f.map(x=>`<div class="datum"><span class="k">${esc(x.label)}</span><span>${esc(typeof x.value==='object'?JSON.stringify(x.value):x.value)}${x.units?' '+esc(x.units):''}</span></div>`).join(''):'<div class="status">No current station data.</div>'}
function renderAlerts(){let x=[];for(const e of E)if(missed(e[1]))x.push(`<div class="alert bad"><b>MISSED ${e[0]}</b> · ${e[2]}</div>`);for(const q of pending())x.push(`<div class="alert attn"><b>CAPCOM PENDING #${q.details.item_id}</b> · ${esc(q.details.action)}</div>`);for(const st of ST)if(readiness(st)===false)x.push(`<div class="alert attn"><b>${st.replace('_','/')} NOT READY</b></div>`);let lastCrew=[...A].reverse().find(e=>String(e.kind).includes('crew_'));if(lastCrew)x.push(`<div class="alert"><b>${hms(lastCrew.get_s)} CREW</b> · ${esc(lastCrew.kind)}</div>`);document.getElementById('alerts').innerHTML=x.length?x.join(''):'<div class="alert"><span class="ok">No action needed.</span></div>'}
function render(){renderTop();renderStations();renderController();renderAlerts();if(drawerMode)drawDrawer(drawerMode)}
function closeDrawer(){drawerMode=null;document.getElementById('drawer').classList.remove('open');document.querySelectorAll('.bottom button').forEach((b,i)=>b.classList.toggle('active',i===0))}function openDrawer(mode){drawerMode=mode;drawDrawer(mode);document.getElementById('drawer').classList.add('open');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));event.currentTarget.classList.add('active')}
function drawDrawer(mode){let d=document.getElementById('drawer');if(mode==='time'){d.innerHTML=`<h2>Time / run controls</h2><div class="quick"><button class="good" onclick="post('/api/session/start')">START</button><button class="warn" onclick="post('/api/session/pause')">PAUSE</button><button onclick="post('/api/session/resume')">RESUME</button><button onclick="post('/api/session/create')">RESET</button><button class="primary" onclick="skipNext()">NEXT −15s</button><button onclick="delta(60)">+1m</button><button onclick="delta(300)">+5m</button><button onclick="delta(1800)">+30m</button></div><h2 style="margin-top:10px">Sequence</h2><div class="timeline">${E.map(e=>`<div class="ev ${missed(e[1])?'missed':applied(e[1])?'done':''}">${e[0]} · ${missed(e[1])?'MISSED · ':applied(e[1])?'✓ · ':''}${e[2]}</div>`).join('')}</div>`}else if(mode==='log'){d.innerHTML=`<h2>Recent audit</h2><div class="log">${A.slice(-30).reverse().map(x=>`<div class="li">${hms(x.get_s)} · ${esc(x.actor)} · ${esc(x.kind)} · ${esc(JSON.stringify(x.details))}</div>`).join('')}</div>`}else{d.innerHTML=`<h2>Debug / facilitator</h2><div class="debugGrid"><div><label>FACILITATOR TOKEN</label><input id="tok" class="token" type="password" value="${esc(sessionStorage.getItem('apollo_facilitator_token')||'')}"><button style="width:100%;margin-top:5px" onclick="saveToken()">USE TOKEN</button></div><div><button style="width:100%;margin-bottom:5px" onclick="assignAll()">ASSIGN ALL TEST CONTROLLERS</button><button style="width:100%" onclick="refresh()">REFRESH NOW</button></div></div><p class="status">Advanced state injection and crew/vehicle-response paths remain available through the API; this screen keeps them out of the primary validation workflow.</p>`}}
function saveToken(){sessionStorage.setItem('apollo_facilitator_token',document.getElementById('tok').value.trim());refresh()}async function assignAll(){for(const st of ST)if(!owner(st)){try{await req('/api/session/join',{method:'POST',body:JSON.stringify({player_id:pid(st),station:st})})}catch(e){show(e)}}await refresh()}async function delta(n){if(S)await post('/api/session/advance',{target_get_s:S.get_s+n})}async function skipNext(){if(!S)return;let n=E.find(e=>sec(e[0])>S.get_s&&!applied(e[1])&&!missed(e[1]));if(n)await post('/api/session/advance',{target_get_s:Math.max(S.get_s,sec(n[0])-15)})}
async function refresh(){try{S=await req('/api/session/status');A=await req('/api/session/audit');snaps={};for(const st of ST){let p=owner(st);if(p){try{let x=await req(`/api/session/player/${p}`);snaps[st]=x}catch{}}}render()}catch(e){if(!String(e.message).includes('No active'))show(e);S=null;A=[];snaps={};render()}}
refresh();setInterval(refresh,1500);
</script></body></html>
