<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Apollo PC+2 Test Console</title><style>
:root{color-scheme:dark;--bg:#07121b;--p:#0d2231;--p2:#102b3d;--line:#294a60;--txt:#eef6fb;--mut:#9db1bf;--g:#72e79c;--a:#ffd166;--r:#ff7979;--b:#55b4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.25 system-ui,sans-serif;overflow:hidden}button,input{font:inherit}button{border:1px solid var(--line);background:#17364c;color:var(--txt);border-radius:6px;padding:7px;cursor:pointer}.good{background:#155c35}.warn{background:#594814}.bad{background:#642b2b}.primary{background:#1268b5}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line);background:#081722}.get{font-size:25px;font-weight:850;color:#a8f7be}.phase{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-weight:800}.RUNNING{color:var(--g)}.PAUSED{color:var(--a)}.token{width:125px;background:#07131c;border:1px solid var(--line);color:var(--txt);padding:6px;border-radius:6px}.main{min-height:0;display:grid;grid-template-columns:1.15fr 1fr 1.25fr;gap:7px;padding:7px}.pane{min-height:0;background:var(--p);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto}.pane h2{font-size:12px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.row{display:flex;gap:5px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.timeControls{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.next{background:#0a3047;border:1px solid #286187;border-radius:7px;padding:7px;margin-bottom:6px}.next strong{color:var(--b)}.timeline{display:grid;gap:2px}.ev{display:grid;grid-template-columns:64px 18px 1fr;gap:4px;padding:3px 4px;border-radius:4px}.ev.now{background:#173c55}.ev.done{opacity:.52}.ev.missed{background:#4a2222;color:#ffd3d3}.dot{font-weight:900}.stationStrip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}.st{padding:5px 2px;text-align:center;border:1px solid var(--line);border-radius:5px;font-size:10px}.st.ready{color:var(--g);border-color:#286644}.st.nr{color:var(--a)}.controller{border:1px solid var(--line);border-radius:7px;padding:6px;margin-bottom:5px;background:#0a1c28}.ch{display:grid;grid-template-columns:80px 1fr auto;gap:5px;align-items:center}.ch strong{font-size:12px}.info{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.actions button{padding:5px 7px;font-size:11px}.data{margin-top:5px;font:10px/1.25 ui-monospace,monospace;color:#c4d4de;max-height:72px;overflow:auto;background:#071722;padding:5px;border-radius:4px}.queue,.log{font:10px/1.25 ui-monospace,monospace}.qi,.li{padding:4px;border-bottom:1px solid #1d3b4e}.pending{color:var(--a)}.ok{color:var(--g)}.err{position:fixed;left:8px;right:8px;bottom:42px;background:#652626;border:1px solid #a75b5b;padding:7px;border-radius:7px;z-index:9;display:none}.bottom{display:none}.desktopOnly{display:block}.mobileTab{display:contents}
@media(max-width:800px){body{overflow:hidden}.top{grid-template-columns:auto 1fr auto;padding:6px}.get{font-size:22px}.phase{grid-column:1/3;grid-row:2;font-size:10px}.token{width:90px;grid-column:3;grid-row:2}.main{display:block;padding:5px 5px 48px;height:100%;overflow:hidden}.pane{display:none;height:100%;overflow:auto}.pane.active{display:block}.stationStrip{grid-template-columns:repeat(4,1fr)}.bottom{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#081722;padding:4px}.bottom button{border:0;background:transparent;color:var(--mut);padding:7px 2px}.bottom button.active{color:var(--b);font-weight:800}.desktopOnly{display:none}.controller .data{max-height:58px}.timeControls{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app">
<header class="top"><div id="get" class="get">--:--:--</div><div id="phase" class="phase">No session</div><div id="state" class="badge">NO SESSION</div><input id="token" class="token" type="password" placeholder="token"></header>
<main class="main">
<section id="run" class="pane active"><h2>Run</h2><div class="grid2"><button class="good" onclick="post('/api/session/start')">START</button><button class="warn" onclick="post('/api/session/pause')">PAUSE</button><button onclick="post('/api/session/resume')">RESUME</button><button onclick="post('/api/session/create')">RESET</button></div><div style="height:6px"></div><div id="next" class="next">Next: --</div><div class="timeControls"><button class="primary" onclick="skipNext()">NEXT −15s</button><button onclick="delta(60)">+1m</button><button onclick="delta(300)">+5m</button><button onclick="delta(1800)">+30m</button><button onclick="delta(3600)">+1h</button></div><h2 style="margin-top:9px">Sequence</h2><div id="timeline" class="timeline"></div></section>
<section id="actions" class="pane"><div class="row" style="justify-content:space-between"><h2>Controller actions</h2><button onclick="assignMissing()">ASSIGN MISSING TEST CONTROLLERS</button></div><div id="strip" class="stationStrip"></div><div id="controllers"></div></section>
<section id="monitor" class="pane"><h2>Pending / recent</h2><div id="queue" class="queue"></div><h2 style="margin-top:8px">Latest audit</h2><div id="audit" class="log"></div></section>
</main><div id="err" class="err"></div><nav class="bottom"><button class="active" onclick="tab('run',this)">RUN</button><button onclick="tab('actions',this)">ACTIONS</button><button onclick="tab('monitor',this)">MONITOR</button><button onclick="refresh()">REFRESH</button></nav></div>
<script>
const ST=['FLIGHT','CAPCOM','GUIDO','FIDO_RETRO','TELMU','INCO','CONTROL'];
const E=[['77:55:00','scenario_start_weak_link','Start'],['77:55:24','final_p30_lm_pad_readup_begins','Final PAD readup'],['77:59:17','communications_loud_and_clear_after_sband_change','Comms improve'],['78:00:00','final_pc2_solution_ready','Final solution'],['78:12:00','lm_burn_configuration_powerup','LM burn power-up'],['78:17:00','final_load_requested','Final load requested'],['78:17:00','final_load_transmission_started','Load transmission'],['78:21:54','ranging_switch_verification_requested','Ranging verify'],['78:23:05','computer_returned_to_crew','Computer to crew'],['79:17:00','final_go_no_go_poll','Final GO/NO-GO'],['79:23:00','p40_active_final_preburn','P40 final preburn'],['79:27:28.30','manual_two_jet_ullage_begins','Ullage'],['79:27:38.30','dps_ignition','IGNITION'],['79:27:43.30','throttle_command_40_percent','40% command'],['79:27:51','crew_reports_40_percent','Crew 40%'],['79:28:04.30','throttle_command_maximum','Max command'],['79:28:09','crew_reports_100_percent','Crew 100%'],['79:32:02.12','guided_cutoff','CUTOFF'],['79:32:41','postburn_residual_review','Residual review'],['79:34:00','lm_powerdown_transition','Powerdown'],['79:52:00','ptc_preparation_begins','PTC preparation']];
let S=null,A=[],snaps={}; const pid=s=>'test-'+s.toLowerCase().replace('_','-');
function sec(x){let p=x.split(':').map(Number);return p[0]*3600+p[1]*60+p[2]} function hms(s){s=Math.max(0,s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${q<10?'0':''}${q.toFixed(q%1?1:0)}`}
function hdr(){let t=document.getElementById('token').value||sessionStorage.getItem('apollo_facilitator_token')||'';if(t)sessionStorage.setItem('apollo_facilitator_token',t);return {'Content-Type':'application/json','X-Apollo-Facilitator':t}}
async function req(url,opt={}){let r=await fetch(url,{...opt,headers:{...hdr(),...(opt.headers||{})}});if(!r.ok)throw Error((await r.json().catch(()=>({detail:r.statusText}))).detail||r.statusText);return r.json()}
async function post(url,body={}){try{await req(url,{method:'POST',body:JSON.stringify(body)});await refresh()}catch(e){show(e)}} function show(e){let x=document.getElementById('err');x.textContent=e.message||e;x.style.display='block';setTimeout(()=>x.style.display='none',5000)}
function tab(id,b){document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function applied(name){return A.some(x=>x.kind==='scenario_event_applied'&&x.details.event===name)} function missed(name){return A.some(x=>x.kind==='scenario_event_missed'&&x.details.event===name)}
function renderRun(){let g=S?.get_s||0;document.getElementById('get').textContent=S?hms(g):'--:--:--';document.getElementById('phase').textContent=S?S.phase:'No session';let st=document.getElementById('state');st.textContent=S?.status||'NO SESSION';st.className='badge '+(S?.status||'');let nx=E.find(e=>sec(e[0])>g&&!applied(e[1])&&!missed(e[1]));document.getElementById('next').innerHTML=nx?`<strong>${nx[0]}</strong> ${nx[2]} · ${hms(sec(nx[0])-g)} away`:'No remaining scheduled event';let near=E.map((e,i)=>({e,i,t:sec(e[0])})).filter(x=>Math.abs(x.t-g)<900||(!applied(x.e[1])&&x.t>=g)).slice(0,8);document.getElementById('timeline').innerHTML=near.map(x=>{let m=missed(x.e[1]),d=applied(x.e[1]),n=!d&&!m&&x.t>=g;return `<div class="ev ${m?'missed':d?'done':n?'now':''}"><span>${x.e[0]}</span><span class="dot">${m?'✕':d?'✓':n?'›':'·'}</span><span>${x.e[2]}</span></div>`}).join('')}
async function delta(n){if(!S)return;await post('/api/session/advance',{target_get_s:S.get_s+n})} async function skipNext(){if(!S)return;let nx=E.find(e=>sec(e[0])>S.get_s&&!applied(e[1])&&!missed(e[1]));if(nx)await post('/api/session/advance',{target_get_s:Math.max(S.get_s,sec(nx[0])-15)})}
function owner(st){let ev=[...A].reverse().find(x=>(x.kind==='station_assigned'&&x.details.station===st)||(x.kind==='station_set_assigned'&&(x.details.stations||[]).includes(st)));return ev?.details.player_id||null} function readiness(st){let ev=[...A].reverse().find(x=>x.kind==='controller_readiness_report'&&x.actor===st);return ev?.details.ready===true?true:ev?false:null}
async function assignMissing(){for(const st of ST){if(!owner(st)){try{await req('/api/session/join',{method:'POST',body:JSON.stringify({player_id:pid(st),station:st})})}catch(e){show(e)}}}await refresh()}
async function ready(st,v){let p=owner(st)||pid(st);await post(`/api/session/player/${p}/readiness`,{ready:v,note:'test console',station:st})} async function flight(go){await post(`/api/session/flight/${owner('FLIGHT')||pid('FLIGHT')}/decision`,{go,basis:'test console validation'})} async function queue(){await post(`/api/session/flight/${owner('FLIGHT')||pid('FLIGHT')}/capcom`,{action:'continue_pc2_burn_sequence',parameters:{},basis:'FLIGHT approved'})} async function transmit(id){await post(`/api/session/capcom/${owner('CAPCOM')||pid('CAPCOM')}/transmit/${id}`)} async function dp(){await post(`/api/session/control/${owner('CONTROL')||pid('CONTROL')}/delta-p-callout`,{basis:'ground ΔP criterion exceeded'})}
function brief(snap){if(!snap)return 'No snapshot';let p=snap.presentation||snap.presentations||{};let text=JSON.stringify(p);return text.length>450?text.slice(0,450)+'…':text}
function renderActions(){document.getElementById('strip').innerHTML=ST.map(st=>`<div class="st ${readiness(st)===true?'ready':'nr'}">${st.replace('_','/')}<br>${readiness(st)===true?'READY':readiness(st)===false?'NO':'—'}</div>`).join('');document.getElementById('controllers').innerHTML=ST.map(st=>{let p=owner(st),r=readiness(st),extra=st==='FLIGHT'?`<button class="good" onclick="flight(true)">GO</button><button class="bad" onclick="flight(false)">NO-GO</button><button onclick="queue()">QUEUE CAPCOM</button>`:st==='CAPCOM'?pending().map(q=>`<button onclick="transmit(${q.details.item_id})">TX #${q.details.item_id}</button>`).join(''):st==='CONTROL'?`<button class="bad" onclick="dp()">ΔP CALLOUT</button>`:'';return `<div class="controller"><div class="ch"><strong>${st.replace('_','/')}</strong><span class="info">${p||'unassigned'} · ${r===true?'READY':r===false?'NOT READY':'no report'}</span><span></span></div><div class="actions"><button onclick="ready('${st}',true)">READY</button><button onclick="ready('${st}',false)">NOT READY</button>${extra}</div><div class="data">${esc(brief(snaps[st]))}</div></div>`}).join('')}
function pending(){let q=new Map();for(const x of A){if(x.kind==='capcom_item_queued')q.set(x.details.item_id,x);if(x.kind==='capcom_item_transmitted')q.delete(x.details.item_id)}return [...q.values()]}
function renderMonitor(){let p=pending();document.getElementById('queue').innerHTML=p.length?p.map(x=>`<div class="qi pending">#${x.details.item_id} ${x.details.action} · from ${x.actor}</div>`).join(''):'<div class="qi ok">No pending CAPCOM items</div>';document.getElementById('audit').innerHTML=A.slice(-18).reverse().map(x=>`<div class="li">${hms(x.get_s)} · ${x.actor} · ${x.kind} ${esc(JSON.stringify(x.details))}</div>`).join('')}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function refresh(){try{S=await req('/api/session/status');A=await req('/api/session/audit');snaps={};for(const st of ST){let p=owner(st);if(p){try{let x=await req(`/api/session/player/${p}`);snaps[st]=x.stations?x.stations[st]:x}catch{}}}renderRun();renderActions();renderMonitor()}catch(e){if(!String(e.message).includes('No active'))show(e)}}
document.getElementById('token').value=sessionStorage.getItem('apollo_facilitator_token')||'';refresh();setInterval(refresh,1500);
</script></body></html>
